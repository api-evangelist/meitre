aid: meitre
name: Meitre
description: >-
  Meitre is the leading online reservations, guest, and revenue management
  platform for the world's top restaurants, with a strong presence across Latin
  America. It provides a hardware-agnostic, white-label toolkit that lets
  restaurants manage reservations, availability, waitlists, and guest
  relationships from a single centralized system. Meitre's algorithms
  automatically manage table availability by analyzing the setup of each area of
  a restaurant and demand for each slot, and can require credit-card guarantees
  to virtually eliminate no-shows. Restaurants pay a fixed monthly fee (no
  commission), and Meitre exposes a partner integration API at meitre-api.com
  plus an MCP server for AI-powered natural-language restaurant booking.
